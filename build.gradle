buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = '1.16.5-4.0'
group = 'com.frostfirebloom.manaessencebridge'
archivesBaseName = 'manaessencebridge'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

// Исходники в UTF-8 (русские комментарии и строки сообщений в чате).
// Без этого javac на русской Windows читает их как Cp1251 и текст
// в игре превращается в кракозябры.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

minecraft {
    // MCP-имена (getTileEntity / isRemote / sendStatusMessage и т.д.),
    // под которые изначально написан исходник мода.
    mappings channel: 'snapshot', version: '20210309-1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                manaessencebridge {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                manaessencebridge {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    // Curios API: Botania без него не запускается, так что в игре он есть всегда.
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.34'

    // Botania 1.16.5-420.3 (CurseForge projectId 225643, fileId 4066054).
    // Именно compileOnly: в готовый jar Botania не попадает, в игре он и так
    // стоит отдельным модом в mods/.
    compileOnly fg.deobf('curse.maven:botania-225643:4066054')

    // JEI 1.16.5-7.7.1.153 (CurseForge projectId 238222, fileId 4060770).
    // Тоже compileOnly: плагин грузится только если JEI реально стоит в сборке.
    // Компилируемся против 7.7.1, а не 7.8.x, ради совместимости вниз -
    // API вкладок в ветке 7.x не менялось.
    compileOnly fg.deobf('curse.maven:jei-238222:4060770')

    // The One Probe 1.16-3.1.7 (projectId 245211, fileId 3752096) - опциональна.
    compileOnly fg.deobf('curse.maven:theoneprobe-245211:3752096')

    // Jade 1.16.4-2.8.3 (projectId 324717, fileId 3910873) - опциональна.
    compileOnly fg.deobf('curse.maven:jade-324717:3910873')
    // Curios API - для Пояса Стражении (слот пояса).
    compileOnly fg.deobf('top.theillusivec4.curios:curios-forge:1.16.5-4.1.0.0:api')
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "manaessencebridge",
            "Specification-Vendor"    : "Frostfire Bloom Team",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : "${version}",
            "Implementation-Vendor"   : "Frostfire Bloom Team",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')
